name: testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 e o piso declarado nos pyproject.toml (starlette==1.7.0 e a ultima com suporte a 3.10).
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            servidor-mcp/pyproject.toml
            agente/pyproject.toml
      - run: make install
      - run: make test

  validador:
    # Os dois processos recem-iniciados, como o avaliador roda. Piso de Python apenas.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # -eo pipefail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            servidor-mcp/pyproject.toml
            agente/pyproject.toml
      - run: make install
      - name: Subir servidor MCP e agente
        # Sem REQUEST_STATE_SECRET exportado, o Makefile gera um segredo descartavel para esta execucao.
        run: |
          nohup make servidor > servidor.log 2>&1 &
          nohup make agente > agente.log 2>&1 &
          for p in 7301 7300; do
            timeout 30 bash -c "until (echo > /dev/tcp/127.0.0.1/$p) 2>/dev/null; do sleep 0.5; done"
          done
      - name: make validar
        run: make validar | tee validar.out
      - name: traceparent do validador no stderr do servidor MCP
        run: |
          trace=$(sed -n 's/^trace-id desta execucao: //p' validar.out)
          grep "traceparent=00-$trace-" servidor.log
      - name: Logs dos processos
        if: failure()
        run: tail -n 100 servidor.log agente.log
