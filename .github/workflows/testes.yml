name: testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 e o piso declarado nos pyproject.toml (starlette==1.7.0 e a ultima com suporte a 3.10).
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            servidor-mcp/pyproject.toml
            agente/pyproject.toml
      - run: make install
      - run: make test
