name: ruff

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # Versao travada: regras padrao mudam entre versoes do ruff. Config em ruff.toml na raiz.
      - run: pip install ruff==0.17.5
      - name: ruff check
        run: ruff check --output-format=github servidor-mcp agente
      - name: ruff format --check
        run: ruff format --check --diff servidor-mcp agente
