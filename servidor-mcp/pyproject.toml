[project]
name = "central-salas"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0", "uvicorn==0.54.0", "starlette==1.7.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[project.scripts]
central-salas = "central_salas.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
